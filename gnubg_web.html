<html>
<meta charset="UTF-8">
<canvas id="backgammonBoard" width="600" height="360"></canvas>
<div id="info"> </div>
<div id="instructions">To begin, click "New money session" or "New match". Click "Help" for more instructions.</div>
<div id="buttons">
   <button id="roll" onclick="roll();" disabled="true">Roll</button>
   <button id="double" onclick="double();" disabled="true">Double</button>
   <button id="accept" onclick="accept();" disabled="true">Accept</button>
   <button id="reject" onclick="reject();" disabled="true">Reject</button>
   <button id="beaver" onclick="beaver();" disabled="true">Beaver</button>
   <button type="resign" id="resign" disabled="true"
      onclick='var value = prompt("Enter value(1=single, 2=gammon, 3=backgammon)"); resign(value);'>Resign</button>
   <br>
   <button id="newSession" onclick="newSession();">New money session</button>
   <button id="newMatch" onclick='var length = prompt("Enter match length"); newMatch(length);'>New match</button>
   <button id="download"
      onclick='var filename = prompt("Enter file name to download"); download(filename);'>Download</button>
   <button id="upload" onclick="upload();">Upload</button>
   <button id="help" onclick="window.open('help.html', '_blank');">Help</button>
   <button id="undoMove" onclick="undoLocalMove();" disabled="true">Undo move</button>
   <button id="submitMoves" onclick="submitLocalMoves();" disabled="true">Submit moves</button>
   <span id="pendingMoves" style="margin-left:10px;"></span>
   <br>
   <form id="command_form">
      <label for="command_text">Move or gnubg command:</label>
      <input id="command_text" type="text"></input>
      <input type="submit" value="Submit"></input>
   </form>

</div>
<textarea id="gnubg_log" cols="120" rows="20" readonly="true">
Loading, please wait...
</textarea>

<script src="graphics.js"></script>
<script type="text/javascript">
   function arrayToHeap(typedArray) {
      var numBytes = typedArray.length * typedArray.BYTES_PER_ELEMENT;
      var ptr = Module._malloc(numBytes);
      var heapBytes = Module.HEAPU8.subarray(ptr, ptr + numBytes);
      heapBytes.set(typedArray);
      return heapBytes;
   }

   function makeCommandBuffer() {
      var rawBuffer = new ArrayBuffer(1000);
      var heapView = new Uint8Array(rawBuffer);
      return arrayToHeap(heapView).byteOffset;
   }

   function fillCommandBuffer(buffer, str) {
      for (var i = 0; i < str.length; i++) {
         Module.setValue(buffer + i, str.charCodeAt(i), "i8");
      }
      Module.setValue(buffer + str.length, 0, "i8");
   }

   commandBufferInititalized = false;
   commandBuffer = 0;
   function gnubgCommand(command) {
      if (!commandBufferInititalized) {
         commandBuffer = makeCommandBuffer();
         commandBufferInititalized = true;
      }
      if (command.startsWith("b/") || command.startsWith("bar/") || ["1", "2", "3", "4", "5", "6", "7", "8", "9"].includes(command.substring(0, 1))) {  // assume it's a move
         command = "move " + command;
      }
      fillCommandBuffer(commandBuffer, command);
      writeLog("=> " + command);
      Module._run_command(commandBuffer);
      window.setTimeout(doNextTurn, 0);
   }

   lastLogLine = "";  // needed for stdin prompts from gnubg's GetInput function in gnubg.c
   function writeLog(str) {
      if (str.startsWith("falling back to ArrayBuffer instantiation") || str.startsWith("wasm streaming compile failed") || str.startsWith("file packager has copied file data into memory")) { // suppress various startup messages not from gnubg, put it into console instead
         console.log(str);
      } else {
         // If the engine reports an illegal/unparsable move, revert the last submitted local moves
         if (str.includes("Illegal or unparsable move")) {
            if (lastLocalBoardBeforeSubmit) {
               _localBoardState = lastLocalBoardBeforeSubmit.slice();
            }
            if (lastSubmittedMoves) {
               // restore pending moves so the user can edit/resubmit
               pendingLocalMoves = lastSubmittedMoves.slice();
            } else {
               pendingLocalMoves = [];
            }
            lastSubmittedMoves = null;
            lastLocalBoardBeforeSubmit = null;
            updatePendingMovesUI();
            // redraw the board using restored local state and last draw args (if available)
            if (_lastDrawArgs && _localBoardState) {
               drawBoard(false,
                  _localBoardState,
                  _lastDrawArgs.matchLength,
                  _lastDrawArgs.myScore,
                  _lastDrawArgs.opponentScore,
                  _lastDrawArgs.turn,
                  _lastDrawArgs.dice1,
                  _lastDrawArgs.dice2,
                  _lastDrawArgs.cubeValue,
                  _lastDrawArgs.iMayDouble,
                  _lastDrawArgs.opponentMayDouble,
                  _lastDrawArgs.wasDoubled,
                  _lastDrawArgs.myPiecesOff,
                  _lastDrawArgs.opponentPiecesOff,
                  _lastDrawArgs.crawford,
                  _lastDrawArgs.resignationOffered,
                  _lastDrawArgs.resignationValue);
            }
         }

         if (str.startsWith("board:") || str.includes("offers to resign")) {
            updateBoard(str);
            window.setTimeout(doNextTurn, 1000);
         }

         if (!str.startsWith("board:")) {
            lastLogLine = str;
            var gnubg_log = document.getElementById("gnubg_log");
            gnubg_log.textContent += str;
            gnubg_log.textContent += '\n';
            gnubg_log.scrollTop = gnubg_log.scrollHeight;
         }
      }
   }

   function doNextTurn() {
      Module._doNextTurn();
   }

   window.addEventListener("load", function () {
      var form = document.getElementById("command_form");
      form.addEventListener("submit", function (event) {
         event.preventDefault();

         var command_text_element = document.getElementById("command_text");
         var command = command_text_element.value;
         gnubgCommand(command);
         command_text_element.value = "";
      });

      // draw an empty board on initial load
      drawBoard(true);

      // Click-to-move support: click a point (or the bar) to select a source,
      // then click a destination point to issue a move command (e.g. "8/5" or "bar/5").
      // Relies on helper functions/vars in graphics.js:
      //   getPointFromCoords(x,y), selectedPointForMove, _clickBoardState, _clickBoardTurn,
      //   highlightSelectedPoint(ctx)
      var backgammonBoard = document.getElementById("backgammonBoard");
      backgammonBoard.style.cursor = "pointer";
      backgammonBoard.addEventListener("click", function (e) {
         // Convert event coordinates to canvas coordinates (account for CSS scaling)
         var rect = backgammonBoard.getBoundingClientRect();
         var scaleX = backgammonBoard.width / rect.width;
         var scaleY = backgammonBoard.height / rect.height;
         var x = (e.clientX - rect.left) * scaleX;
         var y = (e.clientY - rect.top) * scaleY;

         // Determine clicked point ("bar", 1..24, or null)
         if (typeof getPointFromCoords !== "function") return;
         var clicked = getPointFromCoords(x, y);

         // Need current board state and whose turn it is
         if (typeof _clickBoardState === "undefined" || _clickBoardState === null) return;
         var board = _clickBoardState;
         var turn = _clickBoardTurn;

         // Selection flow:
         //  - If nothing selected: allow selecting a source only if it's the player's checker and it's the player's turn.
         //  - If a source is already selected: clicking a destination point issues the move.
         if (!selectedPointForMove) {
            if (clicked === "bar") {
               // player's bar is in board[25] (positive values are player's)
               if (turn === 1 && board[25] > 0) {
                  selectedPointForMove = "bar";
                  highlightSelectedPoint(backgammonBoard.getContext("2d"));
               }
            } else if (typeof clicked === "number") {
               if (turn === 1 && board[clicked] > 0) {
                  selectedPointForMove = clicked;
                  highlightSelectedPoint(backgammonBoard.getContext("2d"));
               }
            }
         } else {
            // Already have a selected source
            // Clicking the same source toggles deselect
            if (clicked === selectedPointForMove) {
               selectedPointForMove = null;
               // redraw last known board to clear highlight
               if (typeof lastBoard !== "undefined" && lastBoard !== "") updateBoard(lastBoard);
               return;
            }

            // Only allow destination points (not bar)
            if (clicked === "bar" || clicked === null) {
               return;
            }
            if (typeof clicked === "number") {
               var src = (selectedPointForMove === "bar") ? "bar" : selectedPointForMove;
               var dst = clicked;
               selectedPointForMove = null;
               // Perform the move locally (update local board & pending moves). Do NOT send to gnubg yet.
               performLocalMove(src, dst);            
            }
         }
      }, false);

   });

   lastTurn = 0;
   lastBoard = "";
   resignationOfferPending = false;
   resignationValue = 0;
   function updateBoard(rawBoard) {
      if (resignationOfferPending) {  // Ignore board update immediately after resignation offer, since nothing has changed and we don't want to remove the "Accept or reject the resignation" message
         resignationOfferPending = false;
         resignationValue = 0;
         return;
      }
      var resignationOffered = false;
      if (rawBoard.includes("offers to resign")) {
         resignationOffered = true;
         resignationOfferPending = true;
         if (rawBoard.endsWith("a single game.")) {
            resignationValue = 1;
         } else if (rawBoard.endsWith("a gammon.")) {
            resignationValue = 2;
         } else if (rawBoard.endsWith("a backgammon.")) {
            resignationValue = 3;
         } else {
            console.error("Unknown resignation value " + resignationValue);
         }
         rawBoard = lastBoard;
      }

      var rawBoardSplit = rawBoard.split(":");
      var myName = rawBoardSplit[1];
      var opponentName = rawBoardSplit[2];
      var boardString = rawBoardSplit.slice(6, 6 + 26);
      var board = boardString.map(function (x) { return parseInt(x); });
      var matchLength = parseInt(rawBoardSplit[3]);
      var myScore = parseInt(rawBoardSplit[4]);
      var opponentScore = parseInt(rawBoardSplit[5]);
      var turn = parseInt(rawBoardSplit[32]);
      var dice1 = parseInt(rawBoardSplit[33]);
      var dice2 = parseInt(rawBoardSplit[34]);
      var cubeValue = parseInt(rawBoardSplit[37]);
      var iMayDouble = parseInt(rawBoardSplit[38]);
      var opponentMayDouble = parseInt(rawBoardSplit[39]);
      var wasDoubled = parseInt(rawBoardSplit[40]);
      var myPiecesOff = parseInt(rawBoardSplit[45]);
      var opponentPiecesOff = parseInt(rawBoardSplit[46]);
      var crawford = parseInt(rawBoardSplit[51]);

      if (dice1 > 0 && turn != lastTurn) {
         var name = (turn == 1) ? myName : opponentName;
         writeLog(name + " rolls " + dice1 + " " + dice2);
         lastTurn = turn;
      }

      // Update server board snapshot and last draw args
      _serverBoard = board.slice(); // copy
      // keep server-side bear-off counts so undo/rebuild can restore them correctly
      _serverMyPiecesOff = myPiecesOff;
      _serverOpponentPiecesOff = opponentPiecesOff;
      _lastDrawArgs = {
         matchLength: matchLength,
         myScore: myScore,
         opponentScore: opponentScore,
         turn: turn,
         dice1: dice1,
         dice2: dice2,
         cubeValue: cubeValue,
         iMayDouble: iMayDouble,
         opponentMayDouble: opponentMayDouble,
         wasDoubled: wasDoubled,
         myPiecesOff: myPiecesOff,
         opponentPiecesOff: opponentPiecesOff,
         crawford: crawford,
         resignationOffered: resignationOffered,
         resignationValue: resignationValue
      };

      // Rebuild local board state from server board then reapply any pending local moves
      _localBoardState = _serverBoard.slice();
      if (pendingLocalMoves && pendingLocalMoves.length) {
         for (var i = 0; i < pendingLocalMoves.length; i++) {
            var ok = applyMoveToBoard(_localBoardState, pendingLocalMoves[i]);
            if (!ok) {
               writeLog("Failed to reapply pending move " + pendingLocalMoves[i] + " to local board. Clearing pending moves.");
               pendingLocalMoves = [];
               updatePendingMovesUI();
               _localBoardState = _serverBoard.slice();
               break;
            }
         }
      }

      // Draw using local board state (server board plus unsubmitted local moves)
      drawBoard(false,
         _localBoardState,
         _lastDrawArgs.matchLength,
         _lastDrawArgs.myScore,
         _lastDrawArgs.opponentScore,
         _lastDrawArgs.turn,
         _lastDrawArgs.dice1,
         _lastDrawArgs.dice2,
         _lastDrawArgs.cubeValue,
         _lastDrawArgs.iMayDouble,
         _lastDrawArgs.opponentMayDouble,
         _lastDrawArgs.wasDoubled,
         _lastDrawArgs.myPiecesOff,
         _lastDrawArgs.opponentPiecesOff,
         _lastDrawArgs.crawford,
         _lastDrawArgs.resignationOffered,
         _lastDrawArgs.resignationValue);

      lastBoard = rawBoard;
   }

   function newSession() {
      gnubgCommand("new session");
   }

   function newMatch(matchLength) {
      gnubgCommand("new match " + matchLength);
   }

   function roll() {
      gnubgCommand("roll");
   }

   function double() {
      gnubgCommand("double");
   }

   function accept() {
      gnubgCommand("accept");
   }

   function reject() {
      gnubgCommand("reject");
   }

   function beaver() {
      gnubgCommand("beaver");
   }

   function resign(val) {
      gnubgCommand("resign " + val);
   }

   const fakeDownload = document.createElement('a');
   fakeDownload.style.display = 'none';
   function download(filename) {
      const data = new Blob([FS.readFile(filename, { encoding: 'utf8' })]);
      const url = window.URL.createObjectURL(data);
      fakeDownload.href = url;
      fakeDownload.download = filename;
      document.body.appendChild(fakeDownload);
      fakeDownload.click();
      window.URL.revokeObjectURL(url);
      document.body.removeChild(fakeDownload);
   }

   const fakeUpload = document.createElement('input');
   fakeUpload.type = 'file';
   fakeUpload.multiple = true;
   fakeUpload.style.display = 'none';
   fakeUpload.addEventListener("change", function () {
      for (var i = 0; i < this.files.length; i++) {
         const file = this.files.item(i);
         console.log('Uploading ' + file.name);
         const fileReader = new FileReader();
         fileReader.onload = function (e) {
            const arrayBuffer = e.target.result;
            const data = new Uint8Array(arrayBuffer);
            FS.writeFile(file.name, data);
            writeLog('Successfully uploaded ' + file.name);
         }
         fileReader.onerror = function () {
            writeLog('Could not upload ' + file.name);
         }
         fileReader.readAsArrayBuffer(file);
      }
      document.body.removeChild(this);
   }, false);

   function upload() {
      document.body.appendChild(fakeUpload);
      fakeUpload.click();
   }
   inputBuffer = "";
   inputBufferPointer = 0;

   // Local move tracking state (for click-to-move UI)
   var _serverBoard = null;        // original board from server (array of ints)
   var _localBoardState = null;    // server board + pending local moves applied
   var pendingLocalMoves = [];     // array of strings like "8/5" or "bar/5"
   var _lastDrawArgs = null;       // store last draw args (everything after board param) so we can redraw
   var _serverMyPiecesOff = 0;     // snapshot of server's myPiecesOff (used when rebuilding)
   var _serverOpponentPiecesOff = 0;
   var lastSubmittedMoves = null;  // moves most recently submitted to gnubg (waiting for accept/reject)
   var lastLocalBoardBeforeSubmit = null; // snapshot of local board before last submit (for revert)

   function updatePendingMovesUI() {
      var pendingSpan = document.getElementById("pendingMoves");
      if (!pendingSpan) return;
      pendingSpan.textContent = pendingLocalMoves.length ? ("Pending: " + pendingLocalMoves.join(" ")) : "";
      document.getElementById("undoMove").disabled = (pendingLocalMoves.length === 0);
      document.getElementById("submitMoves").disabled = (pendingLocalMoves.length === 0);
   }

   // Apply a single move string ("src/dst", src may be "bar") to a board array in-place.
   // Returns true if applied, false if invalid (and board is not modified).
   function applyMoveToBoard(boardArr, moveStr) {
      var parts = moveStr.split("/");
      if (parts.length !== 2) return false;
      var src = parts[0];
      var dst = parseInt(parts[1], 10);
      // allow bear-off destination "0"
      if (isNaN(dst) || dst < 0 || dst > 24) {
         writeLog("Invalid destination: " + parts[1]);
         return false;
      }
      var srcIndex;
      if (src === "bar" || src === "b") {
         srcIndex = 25;
      } else {
         srcIndex = parseInt(src, 10);
         if (isNaN(srcIndex) || srcIndex < 1 || srcIndex > 24) {
            writeLog("Invalid source: " + src);
            return false;
         }
      }

      // Validate source has a player's checker
      if (!boardArr[srcIndex] || boardArr[srcIndex] <= 0) {
         writeLog("No player checker at source " + src);
         return false;
      }

      if (dst === 0) {
         // bear off: increment myPiecesOff in _lastDrawArgs (ensure defined)
         if (!_lastDrawArgs) _lastDrawArgs = {};
         _lastDrawArgs.myPiecesOff = (_lastDrawArgs.myPiecesOff || 0) + 1;
      } else {
         // Destination occupied by opponent?
         if (boardArr[dst] < 0) {
            if (Math.abs(boardArr[dst]) === 1) {
               // hit: remove opponent checker to opponent bar (index 0)
               boardArr[0] = (boardArr[0] || 0) - 1; // opponent bar counts negative
               // set destination to 1 for player
               boardArr[dst] = 1;
            } else {
               writeLog("Destination " + dst + " is blocked by opponent.");
               return false;
            }
         } else {
            // normal move: increment destination
            boardArr[dst] = (boardArr[dst] || 0) + 1;
         }
      }

      // decrement source
      boardArr[srcIndex] = boardArr[srcIndex] - 1;
      return true;
   }

   // Perform a local move (called by click handler). Updates _localBoardState and pendingLocalMoves.
   function performLocalMove(src, dst) {
      if (!_localBoardState || !_serverBoard || !_lastDrawArgs) return;
      var moveStr = ((src === "bar") ? "bar" : src.toString()) + "/" + dst.toString();
      // Make a working copy to test apply
      var working = _localBoardState.slice();
      if (!applyMoveToBoard(working, moveStr)) {
         return;
      }
      // Commit working board
      _localBoardState = working;
      pendingLocalMoves.push(moveStr);
      updatePendingMovesUI();
      // redraw using local board state
      drawBoard(false,
         _localBoardState,
         _lastDrawArgs.matchLength,
         _lastDrawArgs.myScore,
         _lastDrawArgs.opponentScore,
         _lastDrawArgs.turn,
         _lastDrawArgs.dice1,
         _lastDrawArgs.dice2,
         _lastDrawArgs.cubeValue,
         _lastDrawArgs.iMayDouble,
         _lastDrawArgs.opponentMayDouble,
         _lastDrawArgs.wasDoubled,
         _lastDrawArgs.myPiecesOff,
         _lastDrawArgs.opponentPiecesOff,
         _lastDrawArgs.crawford,
         _lastDrawArgs.resignationOffered,
         _lastDrawArgs.resignationValue);
   }

   function undoLocalMove() {
      if (pendingLocalMoves.length === 0) return;
      // remove last move and recompute local board from server board applying remaining pending moves
      pendingLocalMoves.pop();
      // rebuild
      _localBoardState = _serverBoard.slice();
      // reset myPiecesOff/opponentPiecesOff to server values before reapplying
      if (!_lastDrawArgs) _lastDrawArgs = {};
      _lastDrawArgs.myPiecesOff = _serverMyPiecesOff;
      _lastDrawArgs.opponentPiecesOff = _serverOpponentPiecesOff;
      for (var i = 0; i < pendingLocalMoves.length; i++) {
         var ok = applyMoveToBoard(_localBoardState, pendingLocalMoves[i]);
         if (!ok) {
            writeLog("Error reapplying move " + pendingLocalMoves[i] + " after undo.");
         }
      }
      updatePendingMovesUI();
      // redraw
      drawBoard(false,
         _localBoardState,
         _lastDrawArgs.matchLength,
         _lastDrawArgs.myScore,
         _lastDrawArgs.opponentScore,
         _lastDrawArgs.turn,
         _lastDrawArgs.dice1,
         _lastDrawArgs.dice2,
         _lastDrawArgs.cubeValue,
         _lastDrawArgs.iMayDouble,
         _lastDrawArgs.opponentMayDouble,
         _lastDrawArgs.wasDoubled,
         _lastDrawArgs.myPiecesOff,
         _lastDrawArgs.opponentPiecesOff,
         _lastDrawArgs.crawford,
         _lastDrawArgs.resignationOffered,
         _lastDrawArgs.resignationValue);
   }

   function submitLocalMoves() {
      if (pendingLocalMoves.length === 0) return;
      var command = pendingLocalMoves.join(" ");
      // Remember what we're submitting so we can revert if server says illegal
      lastSubmittedMoves = pendingLocalMoves.slice();
      lastLocalBoardBeforeSubmit = _localBoardState ? _localBoardState.slice() : null;
      // Clear the pending queue in the UI (they are now "in-flight")
      pendingLocalMoves = [];
      updatePendingMovesUI();
      // Send to gnubg (gnubgCommand will prefix "move " where appropriate)
      gnubgCommand(command);
   }

   var Module = {
      preRun: [
         function () {
            FS.init(
               function stdin() {
                  if (inputBuffer == "") {
                     inputBuffer = window.prompt(lastLogLine);
                     inputBuffer += '\n';
                     inputBufferPointer = 1;
                     return inputBuffer.charCodeAt(0);
                  } else {
                     if (inputBufferPointer < inputBuffer.length) {
                        var code = inputBuffer.charCodeAt(inputBufferPointer);
                        ++inputBufferPointer;
                        return code;
                     } else {
                        inputBuffer = "";
                        return null;
                     }
                  }
               });
         }],
      print: writeLog,
      printErr: writeLog,
      onRuntimeInitialized: function () {
         Module._start();
      }
   }

</script>

<script src="gnubg.js"></script>
<footer>
   <a href="https://github.com/hwatheod/gnubg-web">Github repo for gnubg-web.</a>
</footer>

</html>
